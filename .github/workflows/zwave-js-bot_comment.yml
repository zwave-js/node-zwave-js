name: 'Z-Wave Bot: React to comments'

on:
  issue_comment:
    types: [created] # edited, deleted
  discussion_comment:
    types: [created] # edited, deleted

# Force all jobs to specifically list the permissions they need
permissions: {}

jobs:
  # Publishing a PR build is split into three jobs, so the untrusted PR code never
  # runs in a job that has access to secrets:
  #   check-pr   - inspects the PR, no PR code is executed
  #   pack-pr    - builds and packs the PR code, has no secrets
  #   publish-pr - dispatches publishing in test-and-release.yml, no PR code is executed

  # Check whether a PR build may be published when AlCalzone comments "@zwave-js-bot pack this"
  check-pr:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.html_url, '/pull/') &&
      contains(github.event.comment.body, '@zwave-js-bot pack this') &&
      (github.event.comment.user.login == 'AlCalzone')

    runs-on: [ubuntu-latest]
    permissions:
      contents: read

    outputs:
      merge_commit_sha: ${{ steps.pr-info.outputs.merge_commit_sha }}

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check PR information
      id: pr-info
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const options = {
            owner: context.repo.owner,
            repo: context.repo.repo,
          };
          const { data: pull } = await github.rest.pulls.get({
            ...options,
            pull_number: context.payload.issue.number,
          });

          if (!pull.mergeable || !pull.merge_commit_sha) {
            await github.rest.issues.createComment({
              ...options,
              issue_number: context.payload.issue.number,
              body: `😥 Seems like this PR cannot be merged. Please fix the merge conflicts and try again.`,
            });
            process.exit(1);
          }

          // Security check: Ensure no commits were pushed or force-pushed after the approval comment
          const { wasPRModifiedAfterComment } = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/utils.cjs`);
          let wasModified;
          try {
            wasModified = await wasPRModifiedAfterComment(
              github,
              options.owner,
              options.repo,
              context.payload.issue.number,
              context.payload.comment.id,
            );
          } catch (e) {
            console.error(e);
            await github.rest.issues.createComment({
              ...options,
              issue_number: context.payload.issue.number,
              body: `❌ I tried my best, but something went wrong.`,
            });
            process.exit(1);
          }

          if (wasModified) {
            await github.rest.issues.createComment({
              ...options,
              issue_number: context.payload.issue.number,
              body: `😥 This PR was updated after your comment. Please review the new changes and comment again to publish.`,
            });
            process.exit(1);
          }

          // From now on, only work with the SHA at comment time
          const pinnedSha = pull.merge_commit_sha;
          core.setOutput('merge_commit_sha', pinnedSha);

          await github.rest.issues.createComment({
            ...options,
            issue_number: context.issue.number,
            body: `👋 Hey @${context.payload.comment.user.login}!
                   I've started to deploy this PR as a development build.
                   You can monitor the progress [here](${context.payload.repository.html_url}/actions/runs/${context.runId}).`
          })

  # #########################################################################
  # Build the PR code and pack it into tarballs. This job executes untrusted code,
  # so it must not have access to any secrets.
  pack-pr:
    needs: check-pr

    runs-on: [ubuntu-latest]
    permissions:
      contents: read

    steps:
    - name: Checkout merged code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # We need the history for versioning with yarn
        ref: ${{ needs.check-pr.outputs.merge_commit_sha }}

    - name: Switch to a branch
      run: git switch -c temp

    - name: Prepare environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: 22 # This should be LTS

    - name: Compile TypeScript code
      run: yarn run build

    - name: Determine the version to publish
      id: version
      env:
        PR: ${{ github.event.issue.number }}
        MERGE_COMMIT_SHA: ${{ needs.check-pr.outputs.merge_commit_sha }}
      run: |
        VERSION=$(node -p 'require("semver").inc(require("./package.json").version, "prerelease") + `-pr-${process.env.PR}-${process.env.MERGE_COMMIT_SHA.slice(0, 7)}`')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Apply the version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        yarn workspaces foreach --all version "$VERSION" --deferred
        yarn version apply --all

    - name: Pack the packages
      run: |
        set -o pipefail
        yarn workspaces foreach --all -v --no-private pack --out "$RUNNER_TEMP/tarballs/%s.tgz"

        # Record the topological order, so dependencies get published before their dependents.
        # yarn's `pack --out %s` turns the package name into the file name the same way.
        yarn workspaces foreach --all -t --no-private exec \
          'node -p "require(process.cwd() + \"/package.json\").name.replace(\"/\", \"-\") + \".tgz\""' \
          | grep '\.tgz$' > "$RUNNER_TEMP/tarballs/order.txt"

    - name: Upload the tarballs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pr-tarballs
        path: ${{ runner.temp }}/tarballs
        retention-days: 1

  # #########################################################################
  # Hand the packed tarballs to test-and-release.yml for publishing. npm only accepts
  # OIDC tokens from that workflow when it is the top-level workflow of a run.
  publish-pr:
    needs: [check-pr, pack-pr]
    # Also run when packing failed, so we can report back
    if: always() && needs.check-pr.result == 'success'

    runs-on: [ubuntu-latest]
    permissions:
      actions: write # Required for dispatching test-and-release.yml

    steps:
    - name: Start publishing
      if: needs.pack-pr.result == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        MERGE_COMMIT_SHA: ${{ needs.check-pr.outputs.merge_commit_sha }}
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'test-and-release.yml',
            ref: context.ref,
            inputs: {
              action: 'publish-pr',
              pr: String(context.issue.number),
              'merge-commit-sha': process.env.MERGE_COMMIT_SHA,
              'pack-run-id': String(context.runId),
            },
          });

    - name: Report the failure
      if: needs.pack-pr.result != 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `😥 Unfortunately I could not build the new packages. Check out the logs to see what went wrong.`,
          });


  # #########################################################################
  # Imports a config file when an authorized person posts "@zwave-js-bot import config <device-id> from <source>"
  import-config:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.html_url, '/issues/') &&
      contains(github.event.comment.body, '@zwave-js-bot import config') &&
      (github.event.comment.user.login != 'zwave-js-bot' && github.event.comment.user.login != 'zwave-js-assistant[bot]')

    runs-on: [ubuntu-latest]
    permissions:
      contents: write # Needed to push the branch the PR is created from

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
    - name: Check user's permissions to do this
      id: check-permissions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.checkAuthorized({github, context});

    # These steps only run if the check was successful
    - name: Prepare environment
      if: steps.check-permissions.outputs.result == 'true'
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      if: steps.check-permissions.outputs.result == 'true'
      # We need this or the linter will complain about other stuff than the checks
      run: yarn run build

    - name: Get config file ID
      if: steps.check-permissions.outputs.result == 'true'
      id: config-id
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const body = context.payload.comment.body;
          const match = /import config (?<ids>[a-z0-9_:, -]{1,}?) from (?<source>\w+)/i.exec(body);
          if (!match) return {skip: true};
          return {
            source: match.groups.source,
            ids: match.groups.ids.toLowerCase(),
          }

    - name: Import config files
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.config-id.outputs.result).skip
      id: import
      env:
        source: ${{ fromJSON(steps.config-id.outputs.result).source }}
        ids: ${{ fromJSON(steps.config-id.outputs.result).ids }}
      run: |
        yarn run config import -s "$source" -Dd --ids "$ids"
        branchname="import-config-$(date +'%s')"
        commitmessage="feat(config): import config files from $source"

        # Check if something changed
        git config user.email "bot@zwave-js.io"
        git config user.name "Z-Wave JS Bot"
        git checkout -b "$branchname"
        git add -A

        if ! git diff --quiet HEAD -- packages/config/config/devices/ ; then
          git commit -m "$commitmessage"
          git push --set-upstream origin "$branchname"

          echo "result=success" >> $GITHUB_OUTPUT
          echo "branchname=$branchname" >> $GITHUB_OUTPUT
          echo "commitmessage=$commitmessage" >> $GITHUB_OUTPUT
        else
          echo "result=unchanged" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Create PR
      if: steps.check-permissions.outputs.result == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ steps.import.outputs.result }}
        branchname: ${{ steps.import.outputs.branchname }}
        commitmessage: ${{ steps.import.outputs.commitmessage }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.importConfigCreatePR({github, context});


  # #########################################################################
  # Adds a compat flag to an existing file when an authorized person posts
  # @zwave-js-bot add compat flag to <deviceId>
  # ```
  # mapBasicSet: "auto"
  # ```
  add-compat-flag:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.html_url, '/issues/') &&
      contains(github.event.comment.body, '@zwave-js-bot add compat flag') &&
      (github.event.comment.user.login != 'zwave-js-bot' && github.event.comment.user.login != 'zwave-js-assistant[bot]')

    runs-on: [ubuntu-latest]
    permissions:
      contents: write # Needed to push the branch the PR is created from

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
    - name: Check user's permissions to do this
      id: check-permissions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.checkAuthorized({github, context});

    # These steps only run if the check was successful
    - name: Prepare environment
      if: steps.check-permissions.outputs.result == 'true'
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      if: steps.check-permissions.outputs.result == 'true'
      # We need this or the linter will complain about other stuff than the checks
      run: yarn run build

    - name: Parse command
      if: steps.check-permissions.outputs.result == 'true'
      id: parse-command
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const body = context.payload.comment.body;
          const match1 = /add compat flag to `?(?<id>0x[0-9a-f]{4}:0x[0-9a-f]{4}:0x[0-9a-f]{4}(?::\d+\.\d+)?)`?\s/i.exec(body);
          const match2 = /```(?:jsonc?)?(?<flag>(?:.|\n|\r)*)```/.exec(body);
          if (!match1 || !match2) return {skip: true};
          return {
            id: match1.groups.id.toLowerCase(),
            flag: match2.groups.flag
          }

    - name: Add compat flag
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        id: ${{ fromJSON(steps.parse-command.outputs.result).id }}
        flag: ${{ fromJSON(steps.parse-command.outputs.result).flag }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.addCompatFlag({github, context});

    - name: Commit changes
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      id: commit-changes
      env:
        id: ${{ fromJSON(steps.parse-command.outputs.result).id }}
      run: |
        branchname="add-compat-flag-$(date +'%s')"
        commitmessage="fix(config): add compat flag to $id"

        # Check if something changed
        git config user.email "bot@zwave-js.io"
        git config user.name "Z-Wave JS Bot"
        git checkout -b "$branchname"
        git add -A

        if ! git diff --quiet HEAD -- packages/config/config/devices/ ; then
          git commit -m "$commitmessage"
          git push --set-upstream origin "$branchname"

          echo "result=success" >> $GITHUB_OUTPUT
          echo "branchname=$branchname" >> $GITHUB_OUTPUT
          echo "commitmessage=$commitmessage" >> $GITHUB_OUTPUT
        else
          echo "result=unchanged" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Create PR
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ steps.commit-changes.outputs.result }}
        branchname: ${{ steps.commit-changes.outputs.branchname }}
        commitmessage: ${{ steps.commit-changes.outputs.commitmessage }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.addCompatFlagCreatePR({github, context});


  # #########################################################################
  # Adds a fingerprint to an existing file when an authorized person posts
  # @zwave-js-bot add fingerprint <newId> to <existingDeviceId>
  add-fingerprint:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.html_url, '/issues/') &&
      contains(github.event.comment.body, '@zwave-js-bot add fingerprint') &&
      (github.event.comment.user.login != 'zwave-js-bot' && github.event.comment.user.login != 'zwave-js-assistant[bot]')

    runs-on: [ubuntu-latest]
    permissions:
      contents: write # Needed to push the branch the PR is created from

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
    - name: Check user's permissions to do this
      id: check-permissions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.checkAuthorized({github, context});

    # These steps only run if the check was successful
    - name: Prepare environment
      if: steps.check-permissions.outputs.result == 'true'
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      if: steps.check-permissions.outputs.result == 'true'
      # We need this or the linter will complain about other stuff than the checks
      run: yarn run build

    - name: Parse command
      if: steps.check-permissions.outputs.result == 'true'
      id: parse-command
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const body = context.payload.comment.body;
          const match = /add fingerprint `?(?<fingerprint>0x[0-9a-f]{4}:0x[0-9a-f]{4})`? to `?(?<id>0x[0-9a-f]{4}:0x[0-9a-f]{4}:0x[0-9a-f]{4}(?::\d+\.\d+)?)`?/i.exec(body);
          if (!match) return {skip: true};
          return {
            fingerprint: match.groups.fingerprint.toLowerCase(),
            id: match.groups.id.toLowerCase()
          }

    - name: Add fingerprint
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      id: add-fingerprint
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        fingerprint: ${{ fromJSON(steps.parse-command.outputs.result).fingerprint }}
        id: ${{ fromJSON(steps.parse-command.outputs.result).id }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.addFingerprint({github, context});

    - name: Commit changes
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      id: commit-changes
      env:
        fingerprint: ${{ fromJSON(steps.parse-command.outputs.result).fingerprint }}
        id: ${{ fromJSON(steps.parse-command.outputs.result).id }}
        deviceLabel: ${{ steps.add-fingerprint.outputs.result }}
      run: |
        branchname="add-fingerprint-$(date +'%s')"
        commitmessage="fix(config): add fingerprint \`$fingerprint\` to $deviceLabel"

        # Check if something changed
        git config user.email "bot@zwave-js.io"
        git config user.name "Z-Wave JS Bot"
        git checkout -b "$branchname"
        git add -A

        if ! git diff --quiet HEAD -- packages/config/config/devices/ ; then
          git commit -m "$commitmessage"
          git push --set-upstream origin "$branchname"

          echo "result=success" >> $GITHUB_OUTPUT
          echo "branchname=$branchname" >> $GITHUB_OUTPUT
          echo "commitmessage=$commitmessage" >> $GITHUB_OUTPUT
        else
          echo "result=unchanged" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Create PR
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.parse-command.outputs.result).skip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ steps.commit-changes.outputs.result }}
        branchname: ${{ steps.commit-changes.outputs.branchname }}
        commitmessage: ${{ steps.commit-changes.outputs.commitmessage }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.addFingerprintCreatePR({github, context});


  # #########################################################################
  # Escalate a discussion to an issue when an authorized person posts
  # @zwave-js-bot escalate
  escalate:
    if: |
      github.event_name == 'discussion_comment' &&
      contains(github.event.comment.body, '@zwave-js-bot escalate') &&
      (github.event.comment.user.login != 'zwave-js-bot' && github.event.comment.user.login != 'zwave-js-assistant[bot]')

    runs-on: [ubuntu-latest]
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check user's permissions to do this
      id: check-permissions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.checkAuthorized({github, context});

    # These steps only run if the check was successful
    - name: Escalate discussion to issue
      if: steps.check-permissions.outputs.result == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          return bot.escalate({github, context, core});
