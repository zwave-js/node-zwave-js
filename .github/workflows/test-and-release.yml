name: Test and Release

# Run this job on all pushes to master, for pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      # This avoids having duplicate builds in non-forked PRs
      - "master"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  merge_group:
    types: [checks_requested]

  # Lets other workflows publish packages with OIDC. npm only trusts this workflow
  # as the top-level workflow of a run, so they must dispatch it instead of calling it.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - publish-config
          - publish-pr
      version:
        description: 'publish-config: Version to publish @zwave-js/config with'
        type: string
      pr:
        description: 'publish-pr: Number of the PR to publish'
        type: string
      merge-commit-sha:
        description: 'publish-pr: Merge commit SHA the PR build was packed from'
        type: string
      pack-run-id:
        description: 'publish-pr: ID of the workflow run that packed the PR build'
        type: string

permissions:
  contents: read

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  # Publishing runs are dispatched on master, so they must not cancel or be cancelled by pushes
  group: 'test-and-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.action }}-${{ inputs.pr }}'
  cancel-in-progress: true

env:
  # Additional CLI flags for turbo commands
  TURBO_FLAGS: "" # "--concurrency=2"

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      run: yarn build $TURBO_FLAGS

  # ===================

  # Makes sure that the published packages can be require'd without issues in a production environment
  test-packages:
    if: github.event_name != 'workflow_dispatch'
    needs: [build]

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      run: yarn build $TURBO_FLAGS

    # Test that the generated packages are ok
    # I'd love to use yalc or something for this, but it doesn't use yarn pack to pack the tarballs
    # so we need to fake the install
    - name: Import main entry points for each package
      id: monopack
      run: |
        TMP_DIR=$(mktemp -d)
        echo TMP_DIR=$TMP_DIR >> $GITHUB_OUTPUT

        echo "Re-creating a production environment..."
        yarn monopack --target "$TMP_DIR/.tarballs" --no-version
        cd $TMP_DIR

        npm init -y
        npm i .tarballs/zwave-js.tgz
        # bindings-browser is not automatically installed
        npm i .tarballs/zwave-js-bindings-browser.tgz

        echo "Testing ESM entry points..."
        # Now all entrypoints should work
        node -e '(async () => { await import("zwave-js") })()'
        node -e '(async () => { await import("@zwave-js/cc") })()'
        node -e '(async () => { await import("@zwave-js/config") })()'
        node -e '(async () => { await import("@zwave-js/core") })()'
        node -e '(async () => { await import("@zwave-js/host") })()'
        node -e '(async () => { await import("@zwave-js/nvmedit") })()'
        node -e '(async () => { await import("@zwave-js/serial") })()'
        node -e '(async () => { await import("@zwave-js/shared") })()'
        node -e '(async () => { await import("@zwave-js/testing") })()'
        node -e '(async () => { await import("zwave-js/safe") })()'
        node -e '(async () => { await import("@zwave-js/cc/safe") })()'
        node -e '(async () => { await import("@zwave-js/config/safe") })()'
        node -e '(async () => { await import("@zwave-js/core/safe") })()'
        node -e '(async () => { await import("@zwave-js/nvmedit/safe") })()'
        node -e '(async () => { await import("@zwave-js/serial/safe") })()'
        node -e '(async () => { await import("@zwave-js/shared/safe") })()'
        node -e '(async () => { await import("@zwave-js/bindings-browser/fs") })()'

        echo "Testing CJS entry points..."
        # Now all entrypoints should work
        node -e 'require("zwave-js")'
        node -e 'require("@zwave-js/cc")'
        node -e 'require("@zwave-js/config")'
        node -e 'require("@zwave-js/core")'
        node -e 'require("@zwave-js/host")'
        node -e 'require("@zwave-js/nvmedit")'
        node -e 'require("@zwave-js/serial")'
        node -e 'require("@zwave-js/shared")'
        node -e 'require("@zwave-js/testing")'
        node -e 'require("zwave-js/safe")'
        node -e 'require("@zwave-js/cc/safe")'
        node -e 'require("@zwave-js/config/safe")'
        node -e 'require("@zwave-js/core/safe")'
        node -e 'require("@zwave-js/nvmedit/safe")'
        node -e 'require("@zwave-js/serial/safe")'
        node -e 'require("@zwave-js/shared/safe")'

        echo "Testing version exports..."
        node -e 'assert.equal(require("@zwave-js/config").PACKAGE_VERSION, require("@zwave-js/config/package.json").version)'
        node -e 'assert.equal(require("zwave-js").libVersion, require("zwave-js/package.json").version)'
        node -e 'assert.equal(require("zwave-js").libName, require("zwave-js/package.json").name)'

        echo "Doing spot checks for some exports"
        node -e 'assert.equal(typeof require("@zwave-js/core").randomBytes, "function")'

    # Test if bundling for the browser is supported yet
    - name: Are we browser yet?
      continue-on-error: true
      env:
        TMP_DIR: ${{ steps.monopack.outputs.TMP_DIR }}
      run: |
        cd $TMP_DIR
        npm i -D esbuild
        echo "import 'zwave-js'" > test.mjs
        npx esbuild test.mjs --bundle --format=esm --outdir=build --sourcemap --target=es2022 --platform=browser --analyze=verbose --external:node:crypto
        
  # ===================

  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run linters
      run: yarn run lint $TURBO_FLAGS

  # ===================

  lint-zwave:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Lint config files and Z-Wave specifics
      # Disable log prefix, so GitHub recognizes annotations in the output
      run: yarn run lint:zwave $TURBO_FLAGS --log-prefix=none

  # ===================
  # Runs unit tests on all supported node versions and OSes
  unit-tests:
    if: github.event_name != 'workflow_dispatch'
    name: "Unit tests: ${{ matrix.os }}, Node.js ${{ matrix.node-version }} (part ${{ matrix.shard }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    # # For pull requests, only run tests for changed files
    # - name: Run component tests (changes)
    #   if: github.event_name == 'pull_request'
    #   run: |
    #     git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
    #     yarn run test:dirty --resolve --base origin/${{ github.event.pull_request.base.ref }}

    # For all other events, especially on master and releases, run the full test suite
    # Run the full test suite on master, release branches and tags
    - name: Run component tests (full)
      # if: github.event_name != 'pull_request'
      run: yarn run test:ts --shard ${{ matrix.shard }}

  # ===================
  # Test if the transformers are working
  test-transformers:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    # Transformer tests need their dependencies to be compiled
    - name: Compile test dependencies
      run: |
        yarn workspace @zwave-js/shared run build
        yarn workspace @zwave-js/core run build

    # For pull requests, only run tests for changed files
    - name: Test transformers
      run: yarn workspace @zwave-js/transformers run test:ts

  # # ===================
  # # This job checks if a PR changes the public API surface
  # api-surface:
  #   name: Check public API surface
  #   # Only run for PRs
  #   if: github.event_name == 'pull_request'

  #   needs: [build]

  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       node-version: [22] # This should be LTS

  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  #   - name: Prepare testing environment
  #     uses: ./.github/actions/prepare-env
  #     with:
  #       node-version: ${{ matrix.node-version }}

  #   - name: Generate API report
  #     run: yarn run extract-api $TURBO_FLAGS

  #   - name: Show changes
  #     if: failure()
  #     run: |
  #       cat packages/*/.tmp/api.md

  #   - name: Comment on PR
  #     if: failure()
  #     run: |
  #       echo "The public API surface has changed!" >> $GITHUB_STEP_SUMMARY
  #       echo "Please run" >> $GITHUB_STEP_SUMMARY
  #       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
  #       echo "yarn accept-api" >> $GITHUB_STEP_SUMMARY
  #       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
  #       echo "and review the changes, then commit them if desired." >> $GITHUB_STEP_SUMMARY
  #       echo "" >> $GITHUB_STEP_SUMMARY

  # ===================

  gh-cc-table:
    name: Update CC implementation status
    # Only run for master branch and don't run in forks
    if: |
      github.repository == 'zwave-js/zwave-js' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Update CC table # (maybe)
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const main = require(`${process.env.GITHUB_WORKSPACE}/.github/action-scripts/updateCCImplementationOverview.cjs`);
          return main({github, context});

  # ===================

  generate-overview:
    name: Update toLogEntry overview
    # Only run for master branch and don't run in forks
    if: |
      github.repository == 'zwave-js/zwave-js' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Update overview
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const main = require(`${process.env.GITHUB_WORKSPACE}/.github/action-scripts/updateToLogEntryOverview.cjs`);
          return main({github, context});

  # ===================

  # Deploys the final package to NPM
  deploy:
    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      github.actor == 'AlCalzone' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    needs:
      - build
      - lint
      - lint-zwave
      - unit-tests
      - test-transformers
      - test-packages

    permissions:
      contents: write # Required for creating releases
      id-token: write # Required for publishing with OIDC
    environment: npm

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Compile TypeScript code
      run: yarn build $TURBO_FLAGS

    - name: Extract the version and commit body from the tag
      id: extract_release
      # The body may be multiline, therefore we need to escape some characters
      run: |
        VERSION="$GITHUB_REF"
        VERSION=${VERSION##*/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        EOF=$(od -An -N6 -x /dev/urandom | tr -d ' ')
        BODY=$(git show -s --format=%b)
        echo "BODY<<$EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT
        if [[ $VERSION == *"-"* ]] ; then
          echo "TAG=--tag next" >> $GITHUB_OUTPUT
        fi

    - name: Publish packages to npm
      env:
        TAG: ${{ steps.extract_release.outputs.TAG }}
      run: |
        yarn workspaces foreach --all -vti --no-private npm publish --tolerate-republish $TAG


    - name: Create Github Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        name: Release v${{ steps.extract_release.outputs.VERSION }}
        draft: false
        # Prerelease versions create prereleases on Github
        prerelease: ${{ contains(steps.extract_release.outputs.VERSION, '-') }}
        body: ${{ steps.extract_release.outputs.BODY }}

    # - name: Notify Sentry.io about the release
    #   run: |
    #     npm i -g @sentry/cli
    #     export SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
    #     export SENTRY_URL=https://sentry.iobroker.net
    #     export SENTRY_ORG=iobroker
    #     export SENTRY_PROJECT=zwave-js
    #     export SENTRY_VERSION=zwave-js@${{ steps.extract_release.outputs.VERSION }}
    #     sentry-cli releases new $SENTRY_VERSION
    #     # Commits disabled until the Github integration can be enabled
    #     sentry-cli releases set-commits $SENTRY_VERSION --auto
    #     sentry-cli releases files $SENTRY_VERSION upload-sourcemaps ./packages/*/build
    #     sentry-cli releases finalize $SENTRY_VERSION

  # ===================

  # Publishes nightly config updates dispatched by the nightly-config-publish workflow
  publish-config:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-config'

    permissions:
      contents: read
      id-token: write # Required for publishing with OIDC
    environment: npm

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22] # This should be LTS

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run a fresh build
      run: yarn build

    - name: Apply version to @zwave-js/config
      env:
        VERSION: ${{ inputs.version }}
      run: |
        yarn workspace "@zwave-js/config" version "$VERSION" --deferred
        yarn version apply --all

    - name: Publish @zwave-js/config to npm
      run: yarn workspace "@zwave-js/config" -vi npm publish --tag nightly

  # ===================

  # Publishes a PR build packed by the zwave-js-bot_comment workflow. The tarballs
  # were produced by PR code, so this job must not check out or execute any code.
  publish-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-pr'

    permissions:
      actions: read # Required for downloading the tarballs from the pack run
      id-token: write # Required for publishing with OIDC
    environment: npm

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
    # The tarballs must come from a pack run of the bot, not from a workflow a PR can modify
    - name: Verify the pack run
      env:
        GH_TOKEN: ${{ github.token }}
        PACK_RUN_ID: ${{ inputs.pack-run-id }}
      run: |
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACK_RUN_ID" --jq '.path + " " + .event + " " + .head_branch')
        if [ "$run" != ".github/workflows/zwave-js-bot_comment.yml issue_comment $GITHUB_REF_NAME" ] ; then
          echo "Run $PACK_RUN_ID is not a pack run of the bot: $run"
          exit 1
        fi

    - name: Download the tarballs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pr-tarballs
        path: tarballs
        run-id: ${{ inputs.pack-run-id }}
        github-token: ${{ github.token }}

    # This also creates the .npmrc that npm publish needs
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24 # Ships an npm version that supports OIDC
        registry-url: 'https://registry.npmjs.org'

    # The tarballs and order.txt were produced by PR code, so a modified build must
    # not be able to publish anything else. The name check limits publishing to our
    # own packages, and the version suffix, which is derived from the dispatch inputs,
    # prevents publishing a regular release.
    - name: Validate the tarballs
      id: validate
      env:
        PR: ${{ inputs.pr }}
        MERGE_COMMIT_SHA: ${{ inputs.merge-commit-sha }}
      working-directory: tarballs
      run: |
        if ! [[ "$PR" =~ ^[0-9]+$ && "$MERGE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] ; then
          echo "Invalid PR number or merge commit SHA"
          exit 1
        fi
        suffix="-pr-${PR}-${MERGE_COMMIT_SHA:0:7}"
        while read -r tarball ; do
          if ! [[ "$tarball" =~ ^[a-z0-9-]+\.tgz$ ]] || [ ! -f "$tarball" ] ; then
            echo "Invalid entry in order.txt: $tarball"
            exit 1
          fi
          # publishConfig is checked too, because npm lets it override the registry and dist-tag
          if ! tar -xOf "$tarball" package/package.json | jq -e --arg suffix "$suffix" '
              (.name == "zwave-js" or (.name | startswith("@zwave-js/")))
              and (.version | test("^[0-9a-z.-]+$") and endswith($suffix))
              and ((.publishConfig // {}) | keys - ["access"] | length == 0)
            ' > /dev/null ; then
            echo "$tarball does not contain an expected PR build:"
            tar -xOf "$tarball" package/package.json | jq '{ name, version, publishConfig }'
            exit 1
          fi
        done < order.txt
        echo "version=$(tar -xOf zwave-js.tgz package/package.json | jq -r .version)" >> "$GITHUB_OUTPUT"

    # npm is used instead of yarn, because yarn can only publish a workspace it
    # packs itself, which would require the PR code in this job.
    # Provenance is disabled, because it would attest that the PR code was built
    # from the master commit this run is dispatched on.
    - name: Publish the tarballs to npm
      working-directory: tarballs
      run: |
        while read -r tarball ; do
          delay=5
          while true ; do
            if output=$(npm publish "$tarball" --tag next --provenance=false 2>&1) ; then
              echo "$output"
              break
            fi
            echo "$output"

            # Tolerate a version that already exists, e.g. when the command gets
            # repeated or when a retry follows a publish that did go through
            if echo "$output" | grep -q "cannot publish over" ; then
              break
            fi
            if [ "$delay" -gt 20 ] ; then
              exit 1
            fi

            echo "Retrying $tarball in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
        done < order.txt

  # Reports the result of publish-pr on the PR. This is a separate job, so the bot
  # token is never available in a job that can publish.
  report-pr:
    needs: publish-pr
    if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'publish-pr'

    permissions: {}

    runs-on: ubuntu-latest

    steps:
    - name: Give feedback
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR: ${{ inputs.pr }}
        VERSION: ${{ needs.publish-pr.outputs.version }}
        SUCCESS: ${{ needs.publish-pr.result == 'success' }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const body = process.env.SUCCESS === 'true'
            ? `🎉 The packages have been published.\nYou can now install the test version with\n\`\`\`\nyarn add zwave-js@${process.env.VERSION}\n\`\`\``
            : `😥 Unfortunately I could not publish the new packages. Check out the logs [here](${context.payload.repository.html_url}/actions/runs/${context.runId}).`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number(process.env.PR),
            body,
          });
