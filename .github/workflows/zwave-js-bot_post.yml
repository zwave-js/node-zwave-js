name: 'Z-Wave Bot: react to Issues/Discussions'

on:
  issues:
    types: [opened, edited]
  discussion:
    types: [created, edited]

concurrency:
  group: zwave-js-bot-post-${{ github.event_name }}-${{ github.event.issue.number || github.event.discussion.number }}
  cancel-in-progress: false

# Comments are posted with BOT_TOKEN
permissions:
  contents: read

jobs:
  # Notify issue author when they post the wrong log
  ensure-logfile:
    runs-on: [ubuntu-latest]
    if: github.event_name == 'issues'

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Installs the shared bot-scripts dependencies and exports BOT_SCRIPTS_DIR
    - name: Setup bot scripts
      uses: zwave-js/bot-workflows/actions/setup-bot@34a23a27c19b765f304318e730221e400bbd2848 # v1

    - name: Extract log file from issue body
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: extract
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/index.cjs`);
          const extractResult = await bot.extractLogfile({github, context});

          if (!extractResult) {
            // No log file required
            core.setOutput("shouldContinue", "false");
            return;
          }

          if (extractResult === "ERROR_FETCH" || extractResult === "ERROR_CODE_BLOCK_TOO_LONG") {
            core.setOutput("shouldContinue", "false");
            await bot.ensureLogfileFeedback({github, context}, extractResult);
            return;
          }

          core.setOutput("shouldContinue", "true");
          return extractResult;


    - name: Classify logfile and give feedback
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: steps.extract.outputs.shouldContinue == 'true'
      id: feedback
      env:
        LOGFILE: ${{ steps.extract.outputs.result }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/index.cjs`);
          const classification = bot.classifyLogfile(process.env.LOGFILE);
          console.log('Classification:', classification);

          const feedback = bot.classificationToFeedback(classification);
          return bot.ensureLogfileFeedback({github, context}, feedback);

  # Collapse the bot comments a transferred issue inherited from the repo
  # it came from, they are about the wrong repository now
  hide-transferred-comments:
    runs-on: [ubuntu-latest]
    if: github.event_name == 'issues' && github.event.action == 'opened'

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Hide inherited bot comments
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          await bot.hideTransferredComments({github, context});

  # Add the new post to the posts index, so it can be suggested as a
  # related post before the next nightly rebuild.
  # Edits are reconciled by the nightly rebuild instead, so repeated
  # edits cannot burn compute and cache storage.
  update-posts-index:
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    if: github.event.action == 'opened' || github.event.action == 'created'

    steps:
    - name: Checkout master branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Restoring from the artifact and re-saving the cache below is also how an
    # evicted cache entry heals itself between two nightly rebuilds
    - name: Restore posts index
      id: posts-index
      uses: zwave-js/bot-workflows/actions/restore-bot-index@34a23a27c19b765f304318e730221e400bbd2848 # v1
      with:
        index: posts
        github-token: ${{ github.token }}

    - name: Warn if no posts index is available
      if: steps.posts-index.outputs.found != 'true'
      run: |
        echo "::warning::The posts index could not be restored, from cache or from artifacts - this post will only be indexed by the next nightly rebuild"

    # Installs the shared bot-scripts dependencies (including the local
    # embedding model cache) and exports BOT_SCRIPTS_DIR
    - name: Setup bot scripts
      if: steps.posts-index.outputs.found == 'true'
      uses: zwave-js/bot-workflows/actions/setup-bot@34a23a27c19b765f304318e730221e400bbd2848 # v1

    - name: Add post to index
      id: update
      if: steps.posts-index.outputs.found == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        POSTS_INDEX_PATH: .posts-index/index.json
      with:
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/index.cjs`);
          return bot.updatePostsIndex({github, context});

    # Save under the same version-derived prefix the producers use
    - name: Save posts index
      if: steps.update.outputs.result == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .posts-index
        key: ${{ steps.posts-index.outputs.prefix }}${{ github.run_id }}
