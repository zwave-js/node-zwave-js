name: 'Z-Wave Bot: Approve / Auto-Merge PR'

on:
  issue_comment:
    types: [created] # edited, deleted
  pull_request:
    types: [synchronize, reopened]

# All jobs act through BOT_TOKEN, so the workflow token needs no access
permissions: {}

jobs:
  # #########################################################################
  # Approves and enables automerge on a PR when authorized person comments
  # @zwave-js-bot automerge
  bot-automerge:
    if: |
      contains(github.event.issue.html_url, '/pull/') &&
      contains(github.event.comment.body, '@zwave-js-bot automerge') &&
      github.event.comment.user.login == 'AlCalzone' &&
      github.event.issue.user.login != 'zwave-js-bot'

    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{secrets.BOT_TOKEN}}
          script: |
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            await github.rest.pulls.createReview({
              ...options,
              pull_number: context.payload.issue.number,
              event: "APPROVE"
            });

      - name: Auto-merge PR
        env:
          PR_URL: ${{github.event.issue.html_url}}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr merge --auto --squash "$PR_URL"

  # #########################################################################
  # Approves a PR once when authorized person comments
  # @zwave-js-bot approve
  bot-approve:
    if: |
      contains(github.event.issue.html_url, '/pull/') &&
      contains(github.event.comment.body, '@zwave-js-bot approve') &&
      github.event.comment.user.login == 'AlCalzone' &&
      github.event.issue.user.login != 'zwave-js-bot'

    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{secrets.BOT_TOKEN}}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
              event: "APPROVE"
            });

  bot-reenable-automerge:
    # Don't run in forks, don't run for drafts, don't run for bot PRs
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'zwave-js-bot' &&
      github.event.pull_request.draft == false

    runs-on: [ubuntu-latest]

    steps:
      - name: Check if auto-merging should be enabled
        id: should-automerge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{secrets.BOT_TOKEN}}
          result-encoding: string
          script: |
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const { data: comments } = await github.rest.issues.listComments({
              ...options,
              issue_number: context.issue.number,
            });
            return comments.some(
              (c) =>
                c.user.login === "AlCalzone" &&
                c.body === "@zwave-js-bot automerge",
            );

      - name: Approve PR
        if: ${{ steps.should-automerge.outputs.result == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            await github.rest.pulls.createReview({
              ...options,
              pull_number: context.issue.number,
              event: "APPROVE"
            });

      - name: Auto-merge PR
        if: ${{ steps.should-automerge.outputs.result == 'true' }}
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
